[package]
name = "ai-helper"
version = "0.0.0"
description = "Desktop AI screen-assistant"
authors = ["Konstantin Fedetsov"]
edition = "2021"
rust-version = "1.92"

# The library exposes the composition root + modules so they are unit-testable.
[lib]
name = "ai_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }  # tray-icon: F1 — tray menu + recording indicator
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
# R15: read clipboard text for the paste-code hotkey (`<code_text>` channel).
tauri-plugin-clipboard-manager = "2"
# Diagnostics (2026-10 review §5.5): native log file (rotating) + webview
# console forwarding; `diagnostics_snapshot` returns its tail for bug reports.
tauri-plugin-log = "2"
log = "0.4"
# F1 (2026-10): "Автозапуск" check item in the tray menu (HKCU\...\Run on Windows).
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# --- Added per phase (kept out until needed, see tasks.md) ---
scap = "0.1.0-beta.1"    # spike 0.5 / phase 1: screen capture (Win/Linux) — patched, see vendor/scap/NOTES.md
png = "0.17"             # phase 1: encode captured BGRA frames to PNG for the IPC seam (CaptureResult.imageBase64)
# ort (phase 6): ONNX Runtime for local OCR (PP-OCR det + rec). `load-dynamic`:
# onnxruntime.dll is loaded at runtime from the OCR model folder (fetched by
# `pnpm ocr:fetch`, not linked or downloaded at build time), so the app builds
# and runs without it — OCR just reports itself unavailable. `api-20`: works
# with any ONNX Runtime >= 1.20 (the fetch script pins 1.31).
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-20"] }

# keyring (phase 2): real OS credential store, replacing the phase-0 in-memory
# SecretStore stub. `windows-native` is the only backend enabled so far
# (Windows Credential Manager) — this app is Windows-first; add
# `sync-secret-service`/`apple-native` when actually porting to Linux/macOS
# rather than guessing at the right crypto/async feature combo now (KISS/YAGNI,
# see architecture.md §1). No default features exist on this crate — you must
# opt into a backend per platform, or `Entry::new` falls back to a mock store.
keyring = { version = "3", features = ["windows-native"] }

# reqwest+SSE (phase 2 / spike 0.5): secure-native LLM streaming, see
# spike_llm_stream.rs and native/llm in plan.md. rustls-tls avoids depending
# on a system OpenSSL install on Windows. `multipart` (phase 9): the STT
# transcription call uploads the recorded WAV as multipart/form-data.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
futures-util = "0.3"
# LLM request cancellation (llm_cancel): `sync::Notify` wakes the streaming
# future; `time` for the stream watchdog (first-byte / idle timeouts, see
# openrouter_client.rs). Already in the tree via tauri — no new crate.
tokio = { version = "1", features = ["sync", "time"] }

# wasapi (phase 9): WASAPI loopback capture of the OUTPUT device (interlocutor's
# voice) for cloud STT. cpal was the original plan but has NO Windows loopback
# support (PR #339 added then removed; cpal 0.18.1 still lacks it), so we use the
# purpose-built `wasapi` crate — loopback is first-class there. Windows-only
# crate; this app is Windows-first (same as keyring's windows-native backend).
# See decisions.md ADR #14 phase-9 de-risk notes and spike 9.0.
wasapi = "0.23"

# F5 (2026-10): the active-window capture asks the OS for the foreground
# window (`GetForegroundWindow`/`IsIconic`); the capture itself goes through
# scap's `Target::Window`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# `net`/`io-util`: the stream-watchdog tests run a tiny local HTTP server.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[[example]]
name = "spike_scap"
path = "examples/spike_scap.rs"

[[example]]
name = "spike_llm_stream"
path = "examples/spike_llm_stream.rs"

[[example]]
name = "ocr_check"
path = "examples/ocr_check.rs"

[[example]]
name = "spike_audio_loopback"
path = "examples/spike_audio_loopback.rs"

# scap 0.1.0-beta.1 (and 0.0.8) fail to compile on Windows against the
# currently published windows-capture 1.5.0 (upstream API drift, unfixed on
# crates.io — https://github.com/CapSoftware/scap/issues/180). Patched a
# local vendor copy with the community-known fix. See vendor/scap/NOTES.md
# and decisions.md (спайк scap) for details. Remove this patch once upstream
# publishes a fixed release compatible with windows-capture >=1.5.0.
[patch.crates-io]
scap = { path = "vendor/scap" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
